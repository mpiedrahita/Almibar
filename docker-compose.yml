# Levanta MySQL 8.4 para el módulo de productos.
# Usa las variables del archivo .env (cópialo desde .env.example).
services:
  mysql:
    image: mysql:8.4
    container_name: almibar-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-almibar}
      MYSQL_USER: ${DB_USER:-almibar}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: America/Bogota
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "3306:3306"
    volumes:
      - almibar-datos:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  almibar-datos:
