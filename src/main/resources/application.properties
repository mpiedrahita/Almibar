# ------------------------------------------------------------------
# Almíbar · Módulo de productos
# Configuración común. Los valores sensibles llegan por variables de
# entorno o por el archivo .env de la raíz del proyecto (RNF-09, RNF-20).
# ------------------------------------------------------------------
spring.application.name=almibar-productos
spring.config.import=optional:file:.env[.properties]
spring.profiles.default=dev

server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.tomcat.threads.max=${SERVIDOR_HILOS_MAX:200}

# Base de datos MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/almibar?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:almibar}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.connection-timeout=5000

# JPA: la estructura la crea Flyway, Hibernate no la modifica
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.flyway.enabled=true

# Imágenes (RNF-21 y RNF-22)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.imagenes.proveedor=${IMAGENES_PROVEEDOR:local}
app.imagenes.directorio=${IMAGENES_DIRECTORIO:uploads}
app.imagenes.tamano-maximo-bytes=5242880
app.imagenes.nube.nombre-cuenta=${CLOUDINARY_CLOUD_NAME:}
app.imagenes.nube.clave-api=${CLOUDINARY_API_KEY:}
app.imagenes.nube.secreto-api=${CLOUDINARY_API_SECRET:}

# Seguridad (RNF-09 y RNF-P02)
app.jwt.secreto=${JWT_SECRET}
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:60}

# Monitoreo (RNF-05 y RNF-26): salud pública, métricas solo para ADMIN
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN

# Registro de errores sin datos sensibles
logging.level.com.reposteria.productos=INFO
logging.file.name=${LOG_ARCHIVO:logs/almibar.log}
