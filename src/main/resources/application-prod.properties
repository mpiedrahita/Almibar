# Perfil de producción (RNF-08): HTTPS obligatorio con un certificado propio.
# El certificado y su clave llegan por variables de entorno; no se guardan en el código.
server.port=${PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SSL_KEY_ALIAS:almibar}
server.forward-headers-strategy=framework
logging.level.com.reposteria.productos=INFO
